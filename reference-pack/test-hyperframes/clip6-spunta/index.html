<!doctype html>
<html lang="it" data-composition-variables='[{"id":"brand","type":"string","label":"Brand","default":"PRATICA"},{"id":"tagline","type":"string","label":"Claim","default":"La burocrazia, dal telefono."},{"id":"accent","type":"color","label":"Accento","default":"#FF5A1F"}]'>
<head>
<meta charset="utf-8">
<script src="assets/js/gsap.min.js"></script>
<style>
  :root { --paper:#EDEAE3; --ink:#1A1A1A; --accent:#FF5A1F; --line:#D3CDC1; --white:#FFFFFF; }
  html,body { margin:0; background:var(--paper); }
  #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--paper); font-family:Outfit, sans-serif; color:var(--ink); }
  .fill { position:absolute; inset:0; }

  /* scene 1: the form */
  #form { position:absolute; left:510px; top:210px; width:900px; height:660px; z-index:10; }
  #form-in { position:absolute; inset:0; background:var(--white); border-radius:28px; box-shadow:0 30px 80px rgba(40,30,20,0.12), 0 4px 14px rgba(40,30,20,0.06); }
  #form-title { position:absolute; left:64px; top:52px; font-size:44px; font-weight:700; letter-spacing:-0.01em; margin:0; }
  #form-sub { position:absolute; left:64px; top:110px; font-size:28px; font-weight:500; color:#8A8478; margin:0; }
  #count { position:absolute; right:64px; top:58px; font-size:36px; font-weight:700; color:#8A8478; }
  #count span { position:absolute; right:0; top:0; white-space:nowrap; opacity:0; }
  .row { position:absolute; left:64px; width:772px; height:56px; }
  .lab { position:absolute; left:0; top:-6px; font-size:28px; font-weight:600; color:#8A8478; }
  .bar { position:absolute; left:0; top:36px; width:640px; height:14px; border-radius:7px; background:var(--line); overflow:hidden; }
  .bar i { position:absolute; inset:0; background:var(--ink); border-radius:7px; transform-origin:0 50%; }
  .ck { position:absolute; left:716px; top:6px; width:48px; height:48px; border-radius:12px; background:var(--accent); }
  .ck svg, #tick svg { position:absolute; inset:0; width:100%; height:100%; }

  /* the travelling mark */
  #tick { position:absolute; left:0; top:0; width:120px; height:120px; z-index:40; }
  #tick-sq { position:absolute; inset:0; border-radius:30px; background:var(--accent); }

  /* scene 2: orange world */
  #flood { position:absolute; inset:0; background:var(--accent); z-index:30; }
  .word { position:absolute; left:0; right:0; top:330px; text-align:center; z-index:35; margin:0; font-size:300px; font-weight:800; letter-spacing:-0.04em; line-height:1; color:var(--white); }
  .word b { display:inline-block; font-weight:800; }

  /* scene 3: notification */
  #note { position:absolute; left:600px; top:450px; width:760px; height:180px; z-index:20; }
  #note-in { position:absolute; inset:0; background:var(--white); border-radius:36px; box-shadow:0 30px 80px rgba(40,30,20,0.14); transform-origin:0 50%; }
  #note-t1 { position:absolute; left:200px; top:42px; font-size:46px; font-weight:700; margin:0; }
  #note-t2 { position:absolute; left:200px; top:104px; font-size:30px; font-weight:500; color:#8A8478; margin:0; }

  /* scene 4: logo */
  #logo { position:absolute; left:745px; top:420px; z-index:20; font-size:160px; font-weight:800; letter-spacing:-0.02em; line-height:1; margin:0; }
  #logo span { display:inline-block; }
  #tagline { position:absolute; left:575px; top:640px; z-index:20; font-size:54px; font-weight:500; color:#4A463F; margin:0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="11" data-width="1920" data-height="1080" data-fps="60">

  <div id="form" class="clip" data-start="0" data-duration="3.4" data-track-index="1">
    <div id="form-in">
      <h2 id="form-title">Dichiarazione 730</h2>
      <p id="form-sub">Agenzia delle Entrate · 5 sezioni</p>
      <div id="count"><span id="c0" style="opacity:1">0 / 5</span><span id="c1">1 / 5</span><span id="c2">2 / 5</span><span id="c3">3 / 5</span><span id="c4">4 / 5</span><span id="c5">5 / 5</span></div>
      <div class="row" style="top:190px"><span class="lab">Dati anagrafici</span><div class="bar"><i id="b0"></i></div><div class="ck" id="k0"><svg viewBox="0 0 48 48"><path d="M14 25 L21 32 L34 17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <div class="row" style="top:278px"><span class="lab">Redditi</span><div class="bar"><i id="b1"></i></div><div class="ck" id="k1"><svg viewBox="0 0 48 48"><path d="M14 25 L21 32 L34 17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <div class="row" style="top:366px"><span class="lab">Spese mediche</span><div class="bar"><i id="b2"></i></div><div class="ck" id="k2"><svg viewBox="0 0 48 48"><path d="M14 25 L21 32 L34 17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <div class="row" style="top:454px"><span class="lab">Detrazioni</span><div class="bar"><i id="b3"></i></div><div class="ck" id="k3"><svg viewBox="0 0 48 48"><path d="M14 25 L21 32 L34 17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <div class="row" style="top:542px"><span class="lab">Firma e invio</span><div class="bar"><i id="b4"></i></div><div class="ck" id="k4"><svg viewBox="0 0 48 48"><path d="M14 25 L21 32 L34 17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    </div>
  </div>

  <div id="flood" class="clip" data-start="3.0" data-duration="3.55" data-track-index="2"><div id="flood-in" class="fill" style="background:var(--accent)"></div></div>

  <h1 id="w1" class="word clip" data-start="3.6" data-duration="0.6" data-track-index="3"><b>730.</b></h1>
  <h1 id="w2" class="word clip" data-start="4.2" data-duration="0.6" data-track-index="3"><b>BOLLETTE.</b></h1>
  <h1 id="w3" class="word clip" data-start="4.8" data-duration="0.6" data-track-index="3"><b>RICORSI.</b></h1>
  <h1 id="w4" class="word clip" data-start="5.4" data-duration="0.6" data-track-index="3"><b>FATTO.</b></h1>

  <div id="note" class="clip" data-start="6.4" data-duration="1.75" data-track-index="4">
    <div id="note-in">
      <p id="note-t1">Pratica inviata</p>
      <p id="note-t2">730 · in 3 minuti</p>
    </div>
  </div>

  <h1 id="logo" class="clip" data-start="7.95" data-duration="3.05" data-track-index="5"><span>P</span><span>R</span><span>A</span><span>T</span><span>I</span><span>C</span><span>A</span></h1>
  <p id="tagline" class="clip" data-start="8.75" data-duration="2.25" data-track-index="6"><span id="tag-in" style="display:inline-block" data-var-text="tagline">La burocrazia, dal telefono.</span></p>

  <div id="tick" class="clip" data-start="0" data-duration="11" data-track-index="7">
    <div id="tick-body" class="fill">
      <div id="tick-sq"></div>
      <svg viewBox="0 0 120 120"><path id="tick-path" d="M34 62 L52 80 L86 42" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <!-- sound: each hit lands one frame after its picture -->
  <audio id="s-in" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.27" data-duration="0.57" data-volume="0.6" data-track-index="10"></audio>
  <audio id="s-k0" class="clip" src="assets/sfx/pop.mp3" data-start="0.97" data-duration="0.5" data-volume="0.5" data-track-index="11"></audio>
  <audio id="s-k1" class="clip" src="assets/sfx/pop.mp3" data-start="1.33" data-duration="0.5" data-volume="0.5" data-track-index="12"></audio>
  <audio id="s-k2" class="clip" src="assets/sfx/pop.mp3" data-start="1.69" data-duration="0.5" data-volume="0.5" data-track-index="11"></audio>
  <audio id="s-k3" class="clip" src="assets/sfx/pop.mp3" data-start="2.05" data-duration="0.5" data-volume="0.5" data-track-index="12"></audio>
  <audio id="s-k4" class="clip" src="assets/sfx/pop.mp3" data-start="2.41" data-duration="0.5" data-volume="0.6" data-track-index="11"></audio>
  <audio id="s-zoom" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.95" data-duration="0.57" data-volume="0.9" data-track-index="13"></audio>
  <audio id="s-hit1" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="3.62" data-duration="0.58" data-volume="0.7" data-track-index="14"></audio>
  <audio id="s-hit2" class="clip" src="assets/sfx/click-soft.mp3" data-start="4.22" data-duration="0.37" data-volume="0.9" data-track-index="15"></audio>
  <audio id="s-hit3" class="clip" src="assets/sfx/click-soft.mp3" data-start="4.82" data-duration="0.37" data-volume="0.9" data-track-index="16"></audio>
  <audio id="s-hit4" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="5.42" data-duration="0.9" data-volume="0.9" data-track-index="14"></audio>
  <audio id="s-out" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="6.05" data-duration="0.57" data-volume="0.6" data-track-index="13"></audio>
  <audio id="s-note" class="clip" src="assets/sfx/pop.mp3" data-start="6.5" data-duration="0.5" data-volume="0.6" data-track-index="11"></audio>
  <audio id="s-carry" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="7.65" data-duration="0.57" data-volume="0.5" data-track-index="13"></audio>
  <audio id="s-logo" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.02" data-duration="0.37" data-volume="0.8" data-track-index="15"></audio>
</div>

<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const C = (cx, cy) => ({ x: cx - 60, y: cy - 60 });
const FX = 510, FY = 210;                       // form origin
const ROW = [190, 278, 366, 454, 542];
const ck = (i) => C(FX + 64 + 716 + 24, FY + ROW[i] + 6 + 24);   // small check centre

// initial states
gsap.set('#tick', { ...C(-140, 540), scale: 1, transformOrigin: '50% 50%' });

gsap.set('.bar i', { scaleX: 0 });
gsap.set('.ck', { scale: 0, opacity: 0 });
gsap.set('#flood-in', { clipPath: 'circle(0px at 960px 540px)' });
gsap.set('.word b', { scale: 1.3, opacity: 0, filter: 'blur(10px)' });
gsap.set('#note-in', { scaleX: 0.16, opacity: 0 });
gsap.set('#note-t1, #note-t2', { opacity: 0, filter: 'blur(6px)' });
gsap.set('#logo span', { opacity: 0, filter: 'blur(6px)' });
gsap.set('#tag-in', { opacity: 0, y: 14 });
gsap.set('#tick-path', { strokeDasharray: 90, strokeDashoffset: 0 });

// 1. form arrives, the mark enters as a cursor

tl.to('#tick', { ...ck(0), scale: 0.4, duration: 0.6, ease: 'power3.inOut' }, 0.25);

// 2. it hops down the rows; each row fills and keeps a small check
for (let i = 0; i < 5; i++) {
  const t = 0.85 + i * 0.36;
  tl.to(`#b${i}`, { scaleX: 1, duration: 0.28, ease: 'power2.out' }, t - 0.28);
  tl.to(`#k${i}`, { scale: 1, opacity: 1, duration: 0.22, ease: 'back.out(1.6)' }, t + 0.1);
  tl.set(`#c${i}`, { opacity: 0 }, t + 0.1);
  tl.set(`#c${i + 1}`, { opacity: 1 }, t + 0.1);
  if (i < 4) tl.to('#tick', { ...ck(i + 1), duration: 0.24, ease: 'power3.inOut' }, t + 0.12);
}

// 3. zoom through the mark into the orange world
tl.to('#tick', { ...C(960, 540), scale: 1.4, duration: 0.45, ease: 'power2.inOut' }, 2.6);
tl.to('#form-in', { filter: 'blur(14px)', scale: 0.96, duration: 0.3 }, 2.95);
tl.to('#tick', { scale: 22, duration: 0.4, ease: 'power3.in' }, 3.05);
tl.to('#flood-in', { clipPath: 'circle(1200px at 960px 540px)', duration: 0.35, ease: 'power3.in' }, 3.1);
tl.set('#tick', { opacity: 0 }, 3.46);

// 4. words slam on the beat
['#w1', '#w2', '#w3', '#w4'].forEach((w, i) => {
  tl.to(`${w} b`, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.13, ease: 'power4.out' }, 3.6 + i * 0.6);
});

// 5. orange world closes back into the mark, which becomes the notification icon
tl.to('#flood-in', { clipPath: 'circle(60px at 690px 540px)', duration: 0.45, ease: 'power3.inOut' }, 6.0);
tl.set('#tick', { ...C(690, 540), scale: 1, opacity: 1 }, 6.44);
tl.fromTo('#tick-path', { strokeDashoffset: 90 }, { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, 6.44);
tl.to('#note-in', { scaleX: 1, opacity: 1, duration: 0.4, ease: 'expo.out' }, 6.45);
tl.to('#note-t1', { opacity: 1, filter: 'blur(0px)', duration: 0.15 }, 6.6);
tl.to('#note-t2', { opacity: 1, filter: 'blur(0px)', duration: 0.15 }, 6.7);

// 6. the mark carries across and becomes the logo
tl.to('#note-in', { opacity: 0, scaleX: 0.3, filter: 'blur(8px)', duration: 0.25, ease: 'power3.in' }, 7.65);
tl.to('#tick', { ...C(635, 500), duration: 0.5, ease: 'power3.inOut' }, 7.6);
tl.to('#logo span', { opacity: 1, filter: 'blur(0px)', duration: 0.1, stagger: 0.07 }, 8.0);
tl.to('#tag-in', { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, 8.8);

window.__timelines['main'] = tl;
</script>
</body>
</html>
