<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(../fonts/anton/anton-latin-400-normal.woff2)}
@font-face{font-family:InterX;font-weight:200;src:url(../fonts/inter/inter-latin-200-normal.woff2)}
@font-face{font-family:InterX;font-weight:800;src:url(../fonts/inter/inter-latin-800-normal.woff2)}
@font-face{font-family:InterX;font-weight:500;src:url(../fonts/inter/inter-latin-500-normal.woff2)}
@font-face{font-family:Grotesk;font-weight:700;src:url(../fonts/space-grotesk/space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:Archivo;src:url(../fonts/archivo-black/archivo-black-latin-400-normal.woff2)}
@font-face{font-family:Marker;src:url(../fonts/permanent-marker/permanent-marker-latin-400-normal.woff2)}
@font-face{font-family:Serif;src:url(../fonts/dm-serif-display/dm-serif-display-latin-400-normal.woff2)}
@font-face{font-family:Unbounded;font-weight:800;src:url(../fonts/unbounded/unbounded-latin-800-normal.woff2)}
html,body{margin:0;background:#000}</style></head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
// Libreria motion graphics BELUGA: ogni scena e una funzione pura di t (secondi).
const W=1280,H=720,D=2.6,cv=document.getElementById('c'),x=cv.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),p=(t,a,b)=>cl((t-a)/(b-a));
const oC=t=>1-Math.pow(1-t,3),oE=t=>t>=1?1:1-Math.pow(2,-10*t),iC=t=>t*t*t,oB=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let r=Math.imul(s^s>>>15,1|s);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
function bg(c){x.fillStyle=c;x.fillRect(0,0,W,H)}
function txt(s,X,Y,font,fill,al='center'){x.font=font;x.textAlign=al;x.textBaseline='middle';x.fillStyle=fill;x.fillText(s,X,Y)}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function grain(t,amt=0.08){const r=rng(Math.floor(t*30)+7);x.save();x.globalAlpha=amt;for(let i=0;i<2600;i++){x.fillStyle=r()>.5?'#fff':'#000';x.fillRect(r()*W,r()*H,2,2)}x.restore()}
function label(i,name,dark){x.save();x.font='500 15px InterX';x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle=dark?'rgba(255,255,255,.55)':'rgba(0,0,0,.5)';x.fillText(String(i).padStart(2,'0')+'  '+name,28,H-28);x.restore()}

const S=[
['Tipografia cinetica',true,t=>{bg('#0A0A0A');
 const a=oC(p(t,0,.4));x.save();x.filter=`blur(${(1-a)*12}px)`;x.globalAlpha=a;txt('Il tuo',W/2,190+20*(1-a),'200 64px InterX','#fff');x.restore();
 const b=oC(p(t,.35,.8));x.save();x.filter=`blur(${(1-b)*14}px)`;x.globalAlpha=b;x.translate(W/2,385);x.scale(1.15-.15*b,1.15-.15*b);
 const g=x.createLinearGradient(0,-110,0,110);g.addColorStop(0,'#FF8A00');g.addColorStop(1,'#FF2E7E');txt('BRAND',0,0,'220px Anton',g);x.restore();
 const c=oC(p(t,.85,1.25));x.save();x.filter=`blur(${(1-c)*12}px)`;x.globalAlpha=c;txt('in movimento',W/2,545+20*(1-c),'200 56px InterX','#fff');x.restore();}],
['Decodifica e cambio parola',false,t=>{bg('#FAF8FA');const r=rng(Math.floor(t*20));const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&';
 const w1='ZERO';let s='';for(let i=0;i<w1.length;i++)s+=t>.15+i*.12?w1[i]:A[Math.floor(r()*A.length)];txt(s,W/2,280,'700 130px Grotesk','#0A0A0A');
 const sw=oE(p(t,1.3,1.7));x.save();x.beginPath();x.rect(0,360,W,150);x.clip();
 txt('ATTESA',W/2,435-150*sw,'700 130px Grotesk','#0A0A0A');txt('LIMITI',W/2,435+150*(1-sw),'700 130px Grotesk','#FF6A1A');x.restore();}],
['Contatore e anello',true,t=>{bg('#0E1B3D');const k=oE(p(t,.1,1.8));
 x.save();x.lineWidth=14;x.strokeStyle='rgba(255,255,255,.12)';x.beginPath();x.arc(W/2,330,190,0,Math.PI*2);x.stroke();
 x.strokeStyle='#3CC9B0';x.lineCap='round';x.beginPath();x.arc(W/2,330,190,-Math.PI/2,-Math.PI/2+Math.PI*2*.86*k);x.stroke();x.restore();
 txt(Math.round(12500*k).toLocaleString('it-IT'),W/2,320,'120px Anton','#fff');txt('clienti felici',W/2,410,'500 30px InterX','#9FB3D9');}],
['Rivelazione logo',false,t=>{bg('#FFFFFF');const cols=['#E01E6A','#F7D21E','#3CC9B0','#2E6BFF'];
 cols.forEach((c,i)=>{const k=oE(p(t,.05+i*.12,.9+i*.12));if(k<=0)return;x.save();x.globalAlpha=1-p(t,1.2,1.8);x.strokeStyle=c;x.lineWidth=26*(1-k)+2;x.beginPath();x.arc(W/2,300,60+k*420,0,Math.PI*2);x.stroke();x.restore()});
 const l=oB(p(t,.5,1));x.save();x.translate(W/2,300);x.scale(l,l);x.fillStyle='#0A0A0A';x.beginPath();x.arc(0,0,70,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(10,-6,34,20,-.3,0,Math.PI*2);x.fill();x.restore();
 const tr=lerp(70,8,oE(p(t,.9,1.8)));x.save();x.globalAlpha=p(t,.9,1.2);x.font='800 54px Unbounded';x.letterSpacing=tr+'px';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#0A0A0A';x.fillText('BELUGA',W/2,470);x.restore();}],
['Carte che si aprono a griglia',true,t=>{bg('#111318');const cols=[['#FF8A00','#FF2E7E'],['#3CC9B0','#2E6BFF'],['#F7D21E','#FF6A1A'],['#A35BC9','#E3B8F3'],['#2E7F95','#A7DCE6'],['#E01E6A','#7B6FB0']];
 cols.forEach((c,i)=>{const k=oB(p(t,.2+i*.07,.9+i*.07));const gx=200+(i%3)*300,gy=200+Math.floor(i/3)*240;const X=lerp(W/2,gx+120,k),Y=lerp(H/2,gy+100,k),rot=lerp((i-2.5)*.12,0,k);
  x.save();x.translate(X,Y);x.rotate(rot);x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=30;x.shadowOffsetY=12;const g=x.createLinearGradient(-120,-100,120,100);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);rr(-120,-100,240,200,18);x.fillStyle=g;x.fill();x.shadowColor='transparent';
  x.fillStyle='rgba(255,255,255,.85)';rr(-96,-76,110,14,7);x.fill();x.fillStyle='rgba(255,255,255,.45)';rr(-96,-48,170,10,5);x.fill();rr(-96,-28,140,10,5);x.fill();x.fillStyle='rgba(0,0,0,.18)';rr(-96,20,192,56,10);x.fill();x.restore()});}],
['Carta strappata e retino',true,t=>{bg('#F1E8C8');x.save();x.fillStyle='rgba(60,40,20,.13)';for(let yy=0;yy<H;yy+=14)for(let xx=(yy/14%2)*7;xx<W;xx+=14){const r=2.6+1.6*Math.sin(xx*.01+yy*.013);x.beginPath();x.arc(xx,yy,r,0,Math.PI*2);x.fill()}x.restore();
 const k=oC(p(t,.2,1.1));const edge=lerp(-120,W*0.62,k);const r=rng(11);x.save();x.beginPath();x.moveTo(-10,-10);let pts=[];for(let yy=-10;yy<=H+10;yy+=18)pts.push([edge+(r()-.5)*44,yy]);pts.forEach(q=>x.lineTo(q[0],q[1]));x.lineTo(-10,H+10);x.closePath();
 x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=18;x.shadowOffsetX=6;x.fillStyle='#B3202C';x.fill();x.restore();
 x.save();x.strokeStyle='#FBF6E6';x.lineWidth=7;x.beginPath();pts.forEach((q,i)=>i?x.lineTo(q[0]+3,q[1]):x.moveTo(q[0]+3,q[1]));x.stroke();x.restore();
 const a=p(t,.9,1.2);x.save();x.globalAlpha=a;x.translate(W*0.3,H/2);x.rotate(-.05);txt('STORIA',0,0,'150px Archivo','#F1E8C8');x.restore();grain(t,.07);}],
['Pennarello disegnato a mano',false,t=>{bg('#FFFFFF');txt('Prova gratis',W/2,330,'800 120px InterX','#0A0A0A');
 const k=oC(p(t,.3,.9));x.save();x.strokeStyle='#FFD84A';x.lineWidth=26;x.lineCap='round';x.globalCompositeOperation='multiply';x.setLineDash([900,900]);x.lineDashOffset=900*(1-k);x.beginPath();x.moveTo(300,415);x.bezierCurveTo(500,400,760,430,990,408);x.stroke();x.restore();
 const a=oC(p(t,.9,1.5));x.save();x.strokeStyle='#0A0A0A';x.lineWidth=7;x.lineCap='round';x.setLineDash([700,700]);x.lineDashOffset=700*(1-a);x.beginPath();x.moveTo(1150,620);x.bezierCurveTo(1180,520,1120,470,1010,440);x.stroke();x.restore();
 if(a>=1){x.save();x.strokeStyle='#0A0A0A';x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(1040,420);x.lineTo(1008,440);x.lineTo(1044,462);x.stroke();x.restore()}
 txt('qui',1170,650,'44px Marker','#E01E6A');}],
['Gradienti e vetro',true,t=>{bg('#0B0B14');const B=[['#3CC9B0',.5,.2],['#F7D21E',.8,.7],['#E01E6A',.25,.75],['#2E6BFF',.65,.35]];
 x.save();x.filter='blur(80px)';B.forEach((b,i)=>{x.fillStyle=b[0];x.globalAlpha=.85;x.beginPath();x.arc(W*b[1]+140*Math.sin(t*1.3+i*2),H*b[2]+90*Math.cos(t*1.1+i),210,0,Math.PI*2);x.fill()});x.restore();
 const k=oC(p(t,.2,.8));x.save();x.globalAlpha=k;x.translate(0,30*(1-k));rr(W/2-300,H/2-130,600,260,32);x.fillStyle='rgba(255,255,255,.14)';x.fill();x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=1.5;x.stroke();
 txt('Novità 2026',W/2,H/2-20,'800 64px InterX','#fff');txt('scopri la collezione',W/2,H/2+50,'500 26px InterX','rgba(255,255,255,.8)');x.restore();}],
['Light leak e grana pellicola',true,t=>{const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2B1D14');g.addColorStop(1,'#120C08');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();x.globalCompositeOperation='screen';[[-.2,'255,120,40'],[.3,'255,200,80'],[.7,'255,60,90']].forEach((l,i)=>{const cx=W*(l[0]+t*.35),r=x.createRadialGradient(cx,H*.4,0,cx,H*.4,520);r.addColorStop(0,`rgba(${l[1]},.75)`);r.addColorStop(1,`rgba(${l[1]},0)`);x.fillStyle=r;x.fillRect(0,0,W,H)});x.restore();
 txt('Ricordi',W/2,H/2,'150px Serif','#FFF3E0');const v=x.createRadialGradient(W/2,H/2,250,W/2,H/2,800);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.7)');x.fillStyle=v;x.fillRect(0,0,W,H);grain(t,.12);}],
['Carta 3D in prospettiva',true,t=>{bg('#16161D');const k=oC(p(t,.1,1.6));const th=lerp(1.1,-.25,k);const cw=300*Math.cos(th),h=440,d=26*Math.sin(th);
 x.save();x.translate(W/2,H/2);x.fillStyle='rgba(0,0,0,.4)';x.filter='blur(18px)';x.beginPath();x.ellipse(0,250,Math.abs(cw)*.7+40,24,0,0,Math.PI*2);x.fill();x.filter='none';
 x.fillStyle='#2A2A35';x.beginPath();x.moveTo(cw/2,-h/2);x.lineTo(cw/2+d,-h/2+10);x.lineTo(cw/2+d,h/2-10);x.lineTo(cw/2,h/2);x.closePath();x.fill();
 x.transform(1,Math.sin(th)*-.12,0,1,0,0);const g=x.createLinearGradient(-cw/2,-h/2,cw/2,h/2);g.addColorStop(0,'#FF8A00');g.addColorStop(1,'#FF2E7E');rr(-Math.abs(cw)/2,-h/2,Math.abs(cw),h,28);x.fillStyle=g;x.fill();
 x.scale(Math.abs(Math.cos(th)),1);txt('APP',0,-40,'110px Anton','#fff');txt('scarica ora',0,60,'500 30px InterX','rgba(255,255,255,.85)');x.restore();}],
['Coriandoli e prezzo',false,t=>{bg('#FFF4E8');const r=rng(5),cols=['#FF2E7E','#FFD84A','#3CC9B0','#2E6BFF','#FF6A1A'];const tt=p(t,.3,2.6)*1.1;
 for(let i=0;i<160;i++){const a=r()*Math.PI*2,sp=300+r()*700,X=W/2+Math.cos(a)*sp*tt,Y=H/2+Math.sin(a)*sp*tt+500*tt*tt,rot=r()*6+tt*8*(r()-.5);if(t<.3)break;x.save();x.translate(X,Y);x.rotate(rot);x.fillStyle=cols[i%5];x.fillRect(-7,-4,14,8);x.restore()}
 const k=oB(p(t,.25,.7));x.save();x.translate(W/2,H/2);x.scale(k,k);txt('-30%',0,0,'230px Anton','#0A0A0A');x.restore();}],
['Grafico che cresce',false,t=>{bg('#F7F7F2');const v=[38,52,47,66,88];txt('Vendite +48%',120,120,'800 54px InterX','#0A0A0A','left');x.fillStyle='#0A0A0A';x.fillRect(120,600,1040,3);
 v.forEach((val,i)=>{const k=oE(p(t,.3+i*.12,1.1+i*.12));const bh=val*4.6*k,X=170+i*200;x.fillStyle=i==4?'#FF6A1A':'#C9C9BE';rr(X,600-bh,120,bh,10);x.fill();if(k>.1)txt(Math.round(val*k)+'k',X+60,580-bh,'800 30px InterX',i==4?'#FF6A1A':'#555','center')});}],
['Scia di movimento',false,t=>{bg('#FAF8FA');const k=oE(p(t,.1,.9));const X=lerp(-500,W/2,k);
 for(let i=6;i>=1;i--){const lag=oE(p(t,.1+i*.035,.9+i*.035));x.save();x.globalAlpha=.16*(7-i)/6+.05;txt('Veloce',lerp(-500,W/2,lag)-0,H/2+i*6,'190px Anton','#FF6A1A');x.restore()}
 txt('Veloce',X,H/2,'190px Anton','#0A0A0A');}],
['Bottone pillola e sottopancia',true,t=>{bg('#0A0A0A');const a=oB(p(t,.1,.45)),b=oC(p(t,.45,.9));const w=lerp(24,420,b),h=lerp(24,96,a);
 x.save();x.shadowColor='#FFE14A';x.shadowBlur=26*b;rr(W/2-w/2,300-h/2,w,h,h/2);x.fillStyle='#111';x.fill();x.lineWidth=3;x.strokeStyle='#FFE14A';x.stroke();x.restore();
 x.save();x.globalAlpha=p(t,.8,1.05);txt('Ordina ora →',W/2,300,'800 40px InterX','#fff');x.restore();
 const c=oC(p(t,1.1,1.6));x.save();x.beginPath();x.rect(120,500,800,120);x.clip();x.fillStyle='#FF6A1A';x.fillRect(lerp(-700,120,c),520,8,84);
 x.translate(lerp(-700,0,c),0);txt('Giulia Rossi',150,545,'800 40px InterX','#fff','left');txt('Fondatrice, Beluga Studio',150,590,'500 24px InterX','rgba(255,255,255,.7)','left');x.restore();}],
];
window.TOTAL=S.length*D;window.SCENES=S.map(s=>s[0]);
window.drawFrame=t=>{const i=Math.min(S.length-1,Math.floor(t/D)),lt=t-i*D;x.save();S[i][2](lt);x.restore();label(i+1,S[i][0],S[i][1]);};
</script></body></html>
