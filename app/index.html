<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0815">
<meta name="description" content="Niko, il socio creativo di Fede. Chat, lavori e calendario del progetto BELUGA.">
<title>Niko</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg style="display:none" aria-hidden="true">
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-work" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></symbol>
  <symbol id="i-team" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5.5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3z"/></symbol>
  <symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
</svg>

<canvas id="space" aria-hidden="true"></canvas>
<div class="window" aria-hidden="true"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">n</span>Niko</div>
    <nav class="nav" aria-label="Sezioni">
      <button data-view="chat"><svg><use href="#i-chat"/></svg>Chat</button>
      <button data-view="work"><svg><use href="#i-work"/></svg>Lavori<b class="pill" id="badge-side"></b></button>
      <button data-view="calendar"><svg><use href="#i-calendar"/></svg>Calendario</button>
      <button data-view="team"><svg><use href="#i-team"/></svg>Squadra</button>
    </nav>
    <p class="demo">Anteprima con dati di esempio. Non parte nessun lavoro vero.</p>
  </aside>

  <main class="main">
    <!-- Niko: colonna a destra sul computer, fascia in alto sul telefono -->
    <aside class="niko" aria-label="Niko">
      <div class="nikopic"><img src="assets/niko-buddy.webp" alt="Niko, robot olografico con cappellino e giacca viola" width="1024" height="1536"></div>
      <div class="nikotext">
        <strong>Niko</strong>
        <p id="nikosays"></p>
        <button class="cta" id="nikocta" data-view="work"></button>
      </div>
    </aside>

    <section class="view" id="view-chat" aria-label="Chat">
      <div class="feed" id="feed"><div class="thread" id="messages" aria-live="polite"></div></div>
      <form class="composer" id="composer">
        <div class="tries" id="tries" aria-label="Esempi di richieste">
          <span>Prova:</span>
          <button type="button" data-try="idee" data-text="Mi servono 3 idee per il reel di mezzeuro ep. 5 sul costo del conto.">3 idee per un reel</button>
          <button type="button" data-try="blender" data-text="In Blender: il logo di mezzeuro che ruota su un tavolo scuro, 4 secondi.">Una scena in Blender</button>
          <button type="button" data-try="hyperframes" data-text="In HyperFrames: il titolo dell'ep. 5 che si scrive lettera per lettera.">Un titolo animato</button>
        </div>
        <div class="inputbox">
          <label for="prompt" class="sr">Scrivi a Niko</label>
          <textarea id="prompt" rows="2" maxlength="4000" placeholder="Scrivi a Niko cosa ti serve…"></textarea>
          <button class="send" type="submit">Invia<svg><use href="#i-arrow"/></svg></button>
        </div>
        <div class="composerrow">
          <span class="rowlabel">Tipo</span>
          <div class="kinds" role="group" aria-label="Tipo di lavoro (facoltativo)">
            <button type="button" data-kind="idee" aria-pressed="false"><svg><use href="#i-spark"/></svg>Idee</button>
            <button type="button" data-kind="blender" aria-pressed="false"><svg><use href="#i-cube"/></svg>Blender</button>
            <button type="button" data-kind="hyperframes" aria-pressed="false"><svg><use href="#i-film"/></svg>HyperFrames</button>
          </div>
          <span class="rowlabel">Progetto</span>
          <label class="sr" for="project">Progetto</label>
          <select id="project">
            <option value="mezzeuro">mezzeuro</option>
            <option value="motion">Libreria motion</option>
          </select>
        </div>
      </form>
    </section>

    <section class="view page" id="view-work" aria-label="Lavori">
      <h1>Lavori</h1>
      <div id="worklist"></div>
    </section>

    <section class="view page" id="view-calendar" aria-label="Calendario">
      <div class="pagehead"><h1 id="monthlabel"></h1>
        <div class="calnav"><button class="soft" id="prevmonth" aria-label="Mese precedente">←</button><button class="soft" id="thismonth">Oggi</button><button class="soft" id="nextmonth" aria-label="Mese successivo">→</button></div>
      </div>
      <div class="legend"><span class="ev out">Uscita mezzeuro</span><span class="ev check">Controllo del piano</span></div>
      <div class="calendar" id="calendar"></div>
    </section>

    <section class="view page" id="view-team" aria-label="Squadra">
      <h1>Squadra</h1>
      <p class="lead">Tu parli solo con Niko. Niko passa il lavoro all'agente giusto e ti porta il risultato da approvare.</p>
      <div class="team" id="team"></div>
      <h2>Collegamenti</h2>
      <ul class="links" id="links"></ul>
    </section>
  </main>

  <nav class="tabs" aria-label="Sezioni">
    <button data-view="chat"><svg><use href="#i-chat"/></svg>Chat</button>
    <button data-view="work"><svg><use href="#i-work"/></svg>Lavori<b class="pill" id="badge-tab"></b></button>
    <button data-view="calendar"><svg><use href="#i-calendar"/></svg>Calendario</button>
    <button data-view="team"><svg><use href="#i-team"/></svg>Squadra</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
